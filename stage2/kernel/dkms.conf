PACKAGE_NAME="hp_victus_rgb"
PACKAGE_VERSION="0.2.0"
# Kernel module for the hp-victus-16-rgb project (Stage 2, sysfs interface).
# Built against the running kernel; DKMS rebuilds automatically whenever a new
# kernel is installed so the module does not break on `pacman -Syu`.

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

# Install the .ko into the module tree so depmod/modprobe can find it.
BUILT_MODULE_NAME[0]="hp_victus_rgb"
BUILT_MODULE_LOCATION[0]="."
DEST_MODULE_LOCATION[0]="/extra/"

AUTOINSTALL="yes"
REMAKE_INITRD="no"

# The module uses HP WMI / ACPI symbols available in every kernel; no patch is
# needed against headers. Pinning an empty PATCH array keeps DKMS quiet.
PATCH[0]=""
